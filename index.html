<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Chat Voice</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 20px;
      text-align: center;
      background: #f8f9fa;
    }
    .mic-btn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: none;
      background: #1a73e8;
      color: white;
      font-size: 18px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(26, 115, 232, 0.35);
      cursor: pointer;
      margin: 20px 0;
    }
    .mic-btn.listening {
      background: #d93025;
      box-shadow: 0 4px 18px rgba(217, 48, 37, 0.45);
    }
    #status {
      background: white;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      min-height: 48px;
      font-size: 15px;
      color: #202124;
      margin-bottom: 24px;
      white-space: pre-wrap;
    }
    .fallback {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }
    .send-btn {
      padding: 12px 18px;
      border-radius: 8px;
      border: none;
      background: #34a853;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Gemini Chat Voice</h2>
  <button id="micBtn" class="mic-btn">🎤 Tap & Speak</button>
  <div id="status">Tap the mic and say:<br>"Tell Alex I will be 10 minutes late"</div>

  <div class="fallback">
    <input id="manualInput" type="text" placeholder="Or use keyboard mic here...">
    <button id="sendBtn" class="send-btn">Send</button>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz-16KF-wsao2a8lw_rzReuOu-PcSxQK62lstP00L9reju19TMOrhUx6HBYHioQ0tZWkA/exec";
    const SECRET_PIN = "1234";

    const micBtn = document.getElementById("micBtn");
    const status = document.getElementById("status");
    const manualInput = document.getElementById("manualInput");
    const sendBtn = document.getElementById("sendBtn");

    function callAppsScript(params) {
      return new Promise((resolve, reject) => {
        const callbackName = "cb_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
        const script = document.createElement("script");
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error("連線逾時（15秒），請檢查網路或部署權限。"));
        }, 15000);

        function cleanup() {
          clearTimeout(timer);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = (data) => {
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error("無法載入 Apps Script，請確認 WEB_APP_URL 與 Anyone 權限。"));
        };

        const url = new URL(WEB_APP_URL.trim());
        url.searchParams.set("callback", callbackName);
        for (const [k, v] of Object.entries(params)) {
          url.searchParams.set(k, v);
        }
        script.src = url.toString();
        document.body.appendChild(script);
      });
    }

    async function sendCommand(commandText) {
      if (!commandText.trim()) return;
      status.textContent = `Heard: "${commandText}"\nSending to Gemini...`;

      try {
        const data = await callAppsScript({ pin: SECRET_PIN, command: commandText });
        status.textContent = data.error
          ? "Error: " + data.error
          : `Sent to [${data.target}]: "${data.message}"`;
      } catch (err) {
        status.textContent = "Error: " + err.message;
      }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = "en-US"; // 若要改中文語音辨識可改為 "zh-TW" 或 "zh-CN"
      recognition.interimResults = false;

      micBtn.onclick = () => {
        try {
          micBtn.classList.add("listening");
          micBtn.textContent = "Listening...";
          status.textContent = "Speak your command now...";
          recognition.start();
        } catch (e) {
          recognition.stop();
        }
      };

      recognition.onresult = (event) => {
        const spoken = event.results[0][0].transcript;
        sendCommand(spoken);
      };

      recognition.onerror = (event) => {
        status.textContent = "Mic error (" + event.error + "). Use the keyboard mic below.";
      };

      recognition.onend = () => {
        micBtn.classList.remove("listening");
        micBtn.textContent = "🎤 Tap & Speak";
      };
    } else {
      micBtn.disabled = true;
      micBtn.textContent = "Use Keyboard Mic";
      status.textContent = "Tap the text box below and press the microphone icon on your Android keyboard.";
    }

    sendBtn.onclick = () => {
      sendCommand(manualInput.value);
      manualInput.value = "";
    };
  </script>
</body>
</html>
