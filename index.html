<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Chat Voice</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 20px;
      text-align: center;
      background: #f8f9fa;
    }
    .mic-btn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: none;
      background: #1a73e8;
      color: white;
      font-size: 18px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(26, 115, 232, 0.35);
      cursor: pointer;
      margin: 20px 0;
    }
    .mic-btn.listening {
      background: #d93025;
      box-shadow: 0 4px 18px rgba(217, 48, 37, 0.45);
    }
    #status {
      background: white;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      min-height: 48px;
      font-size: 15px;
      color: #202124;
      margin-bottom: 24px;
    }
    .fallback {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }
    .send-btn {
      padding: 12px 18px;
      border-radius: 8px;
      border: none;
      background: #34a853;
      color: white;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h2>Gemini Chat Voice</h2>
  <button id="micBtn" class="mic-btn">🎤 Tap & Speak</button>
  <div id="status">Tap the mic and say:<br>"Tell Alex I will be 10 minutes late"</div>

  <!-- Backup input: tap here and use your Android keyboard mic if needed -->
  <div class="fallback">
    <input id="manualInput" type="text" placeholder="Or use keyboard mic here...">
    <button id="sendBtn" class="send-btn">Send</button>
  </div>

  <script>
    const WEB_APP_URL = "YOUR_APPS_SCRIPT_EXEC_URL";
    const SECRET_PIN = "1234";

    const micBtn = document.getElementById("micBtn");
    const status = document.getElementById("status");
    const manualInput = document.getElementById("manualInput");
    const sendBtn = document.getElementById("sendBtn");

    async function sendCommand(commandText) {
      if (!commandText.trim()) return;
      status.textContent = `Heard: "${commandText}"\nSending to Gemini...`;

      try {
        const res = await fetch(WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ pin: SECRET_PIN, command: commandText })
        });
        const rawText = await res.text();
        if (rawText === "Unauthorized") {
          status.textContent = "Error: Wrong SECRET_PIN.";
          return;
        }
        const data = JSON.parse(rawText);
        status.textContent = data.error
          ? "Error: " + data.error
          : `Sent to [${data.target}]: "${data.message}"`;
      } catch (err) {
        status.textContent = "Connection error: " + err.message;
      }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = "en-US"; // Change language code if needed (e.g., "de-DE")
      recognition.interimResults = false;

      micBtn.onclick = () => {
        try {
          micBtn.classList.add("listening");
          micBtn.textContent = "Listening...";
          status.textContent = "Speak your command now...";
          recognition.start();
        } catch (e) {
          recognition.stop();
        }
      };

      recognition.onresult = (event) => {
        const spoken = event.results[0][0].transcript;
        sendCommand(spoken);
      };

      recognition.onerror = (event) => {
        status.textContent = "Mic error (" + event.error + "). Use the keyboard mic below.";
      };

      recognition.onend = () => {
        micBtn.classList.remove("listening");
        micBtn.textContent = "🎤 Tap & Speak";
      };
    } else {
      micBtn.disabled = true;
      micBtn.textContent = "Use Keyboard Mic";
      status.textContent = "Tap the text box below and press the microphone icon on your Android keyboard.";
    }

    sendBtn.onclick = () => {
      sendCommand(manualInput.value);
      manualInput.value = "";
    };
  </script>
</body>
</html>
